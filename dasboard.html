<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SIAMAS</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <div style="background: var(--primary); width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white;">S</div>
                <span>SIAMAS</span>
            </div>
            <ul class="nav-links">
                <li class="nav-item">
                    <a href="dashboard.html" class="nav-link active"><span>📊</span> <span>Dashboard</span></a>
                </li>
                <li class="nav-item">
                    <a href="mahasiswa.html" class="nav-link"><span>👥</span> <span>Mahasiswa</span></a>
                </li>
                <li class="nav-item">
                    <a href="dosen.html" class="nav-link"><span>🎓</span> <span>Dosen</span></a>
                </li>
                <li class="nav-item">
                    <a href="matakuliah.html" class="nav-link"><span>📚</span> <span>Mata Kuliah</span></a>
                </li>
                <li class="nav-item">
                    <a href="laporan.html" class="nav-link"><span>📈</span> <span>Laporan Ringkas</span></a>
                </li>
            </ul>
            <div style="padding-top: 2rem; border-top: 1px solid #f1f5f9;">
                <button onclick="logout()" class="nav-link" style="width: 100%; border: none; background: transparent; cursor: pointer;">
                    <span>🚪</span> <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <div class="top-bar animate-fade">
                <div>
                    <h1 style="font-size: 1.5rem; font-weight: 800;">Dashboard Utama</h1>
                    <div id="breadcrumb-container"></div>
                </div>
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" placeholder="Cari fitur atau mahasiswa..." onkeyup="handleGlobalSearch(event)">
                </div>
            </div>

            <!-- Stats Grid -->
            <div class="stats-grid">
                <div class="card stat-card animate-fade" style="animation-delay: 0.1s">
                    <div class="stat-icon blue-icon">👥</div>
                    <div>
                        <p style="color: var(--text-muted); font-size: 0.875rem;">Mahasiswa</p>
                        <h2 style="font-size: 1.5rem;">245</h2>
                    </div>
                </div>
                <div class="card stat-card animate-fade" style="animation-delay: 0.2s">
                    <div class="stat-icon purple-icon">🎓</div>
                    <div>
                        <p style="color: var(--text-muted); font-size: 0.875rem;">Dosen</p>
                        <h2 style="font-size: 1.5rem;">18</h2>
                    </div>
                </div>
                <div class="card stat-card animate-fade" style="animation-delay: 0.3s">
                    <div class="stat-icon orange-icon">📚</div>
                    <div>
                        <p style="color: var(--text-muted); font-size: 0.875rem;">Mata Kuliah</p>
                        <h2 style="font-size: 1.5rem;">42</h2>
                    </div>
                </div>
                <div class="card stat-card animate-fade" style="animation-delay: 0.4s">
                    <div class="stat-icon green-icon">📈</div>
                    <div>
                        <p style="color: var(--text-muted); font-size: 0.875rem;">Rata-rata IPK</p>
                        <h2 style="font-size: 1.5rem;">3.72</h2>
                    </div>
                </div>
            </div>

            <!-- Charts and Reports -->
            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem;" class="animate-fade">
                <div class="card">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 2rem;">
                        <h3 style="font-weight: 800;">Statistik IPK Mahasiswa</h3>
                        <button class="btn" style="padding: 0.5rem 1rem; font-size: 0.75rem; background: #f1f5f9;">Unduh PDF</button>
                    </div>
                    <div style="height: 300px;">
                        <canvas id="gpaChart"></canvas>
                    </div>
                </div>
                <div class="card">
                    <h3 style="font-weight: 800; margin-bottom: 2rem;">Status Presensi</h3>
                    <div style="height: 250px;">
                        <canvas id="attendanceChart"></canvas>
                    </div>
                    <div style="margin-top: 2rem; font-size: 0.75rem; color: var(--text-muted);">
                        <p>💡 Kehadiran rata-rata naik 4.2% minggu ini.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script src="js/chart.js"></script>
    <script src="js/dasboard.js"></script>
</body>
</html>
