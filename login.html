<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIAMAS</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">
    <div class="login-card animate-fade">
        <div class="login-header">
            <div style="width: 64px; height: 64px; background: #0ea5e9; border-radius: 1.25rem; display: flex; align-items: center; justify-content: center; color: white; margin: 0 auto; font-size: 2rem; font-weight: 800; box-shadow: 0 10px 20px rgba(14, 165, 233, 0.2);">S</div>
            <h2>SIAMAS</h2>
            <p style="color: #64748b; margin-top: 0.5rem;">Sistem Informasi Akademik Mahasiswa</p>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Masukkan username" required value="admin">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Masukkan password" required value="admin">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">
                Sign In
            </button>
        </form>

        <div class="login-footer">
            <p>Admin: admin / admin</p>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
