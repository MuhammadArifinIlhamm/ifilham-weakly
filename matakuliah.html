<!DOCTYPE html>
<html lang="id">
<head>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <div style="background: var(--primary); width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white;">S</div>
                <span>SIAMAS</span>
            </div>
            <ul class="nav-links">
                <li class="nav-item"><a href="dashboard.html" class="nav-link"><span>📊</span> <span>Dashboard</span></a></li>
                <li class="nav-item"><a href="jadwal.html" class="nav-link active"><span>📅</span> <span>Jadwal Kuliah</span></a></li>
                <li class="nav-item"><a href="mahasiswa.html" class="nav-link"><span>👥</span> <span>Mahasiswa</span></a></li>
                <li class="nav-item"><a href="dosen.html" class="nav-link"><span>🎓</span> <span>Dosen</span></a></li>
                <li class="nav-item"><a href="matakuliah.html" class="nav-link"><span>📚</span> <span>Mata Kuliah</span></a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="top-bar">
                <div>
                    <h1 style="font-size: 1.5rem; font-weight: 800;">Jadwal Perkuliahan</h1>
                    <div id="breadcrumb-container"></div>
                </div>
            </div>

            <div class="grid animate-fade" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem;">
                <div class="card">
                    <h3 style="font-weight: 800; border-bottom: 2px solid var(--primary); display: inline-block; padding-bottom: 0.5rem; margin-bottom: 1rem;">Senin</h3>
                    <div style="background: var(--primary-light); padding: 1rem; border-radius: 1rem; margin-top: 0.5rem;">
                        <p style="font-weight: 800; color: var(--primary);">08:00 - 10:30</p>
                        <p style="font-size: 0.875rem;">Algoritma & Pemrograman</p>
                        <p style="font-size: 0.75rem; color: var(--text-muted);">Ruang Lab 2</p>
                    </div>
                </div>
                 <div class="card">
                    <h3 style="font-weight: 800; border-bottom: 2px solid var(--accent); display: inline-block; padding-bottom: 0.5rem; margin-bottom: 1rem;">Selasa</h3>
                    <div style="background: #fef3c7; padding: 1rem; border-radius: 1rem; margin-top: 0.5rem;">
                        <p style="font-weight: 800; color: #d97706;">13:00 - 15:30</p>
                        <p style="font-size: 0.875rem;">Struktur Data</p>
                        <p style="font-size: 0.75rem; color: var(--text-muted);">Ruang C 302</p>
                    </div>
                </div>
            </div>
